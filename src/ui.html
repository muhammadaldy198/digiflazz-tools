<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07111e">
  <title>Digi Tools · Seller Control</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:16px;background:#07111e;color:#eaf1fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 92% -15%,#17486b 0,transparent 35%),#07111e}
    button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}
    :focus-visible{outline:2px solid #5bcbe8;outline-offset:2px}
    .shell{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:100vh}
    aside{border-right:1px solid #23364b;background:#0a1929;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px}
    .brand{display:flex;align-items:center;gap:10px;font-size:1rem;font-weight:800;letter-spacing:.02em;margin:1px 10px 24px}
    .brand-mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#30afd1;color:#07111e;font-weight:900}
    nav{display:grid;gap:3px;overflow:auto}nav button{border:0;background:transparent;color:#9db3c8;text-align:left;padding:10px 12px;border-radius:9px;min-height:40px;font-size:.92rem}
    nav button:hover,nav button.active{color:#f4fbff;background:#163149}nav button.active{box-shadow:inset 3px 0 #4cc7e8}
    .aside-foot{margin-top:auto;padding:16px 10px 3px;border-top:1px solid #26394c;color:#91a9bc;font-size:.8rem;line-height:1.5}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#697b90;margin-right:7px}.dot.good{background:#43d6ab}.dot.warn{background:#f6bd65}
    main{min-width:0;width:min(1390px,100%);padding:27px clamp(16px,3.4vw,46px) 65px;margin:0 auto}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
    h1{font-size:1.65rem;letter-spacing:-.035em;line-height:1.2;margin:0 0 5px}h2{font-size:1.08rem;margin:0 0 14px;letter-spacing:-.015em}h3{font-size:1rem;margin:0 0 8px}
    .sub,.muted,small{color:#91a9bc}.sub{font-size:.88rem;line-height:1.5;margin:0}
    .top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .button{border:1px solid #334c61;background:#132c42;color:#eaf5ff;padding:9px 13px;border-radius:9px;min-height:40px;font-size:.88rem;font-weight:650}
    .button:hover{background:#1c405b}.button.primary{background:#27a7c7;border-color:#27a7c7;color:#031723}.button.primary:hover{background:#56c6df}.button.danger{color:#ffbac2;border-color:#734451;background:#35232f}
    .button.tiny{min-height:32px;padding:5px 9px;font-size:.8rem}
    .button.plain{background:transparent;border-color:transparent;color:#91d7ec;padding-left:4px;padding-right:4px}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .card{border:1px solid #274058;background:#0e2133;border-radius:13px;padding:17px;min-width:0}
    .metric{font-size:1.45rem;font-weight:740;letter-spacing:-.03em;margin:9px 0 3px}.metric-label{color:#9fb3c7;font-size:.84rem}
    .section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.section-head h2{margin:0}
    .badge{display:inline-flex;align-items:center;border:1px solid #3b5a70;border-radius:99px;padding:3px 8px;font-size:.75rem;color:#bbd3e3;white-space:nowrap}
    .badge.good{border-color:#245f58;color:#65e0b7}.badge.warn{border-color:#73512f;color:#ffd18b}.badge.bad{border-color:#78404a;color:#ffadb6}
    .banner{padding:13px 15px;border:1px solid #70502e;background:#342b23;border-radius:10px;color:#ffe0aa;margin-bottom:16px;font-size:.9rem;line-height:1.5}
    .banner.error{border-color:#78404a;background:#34232b;color:#ffbfc5}.banner.ok{border-color:#245f58;background:#15342f;color:#9cf0d0}
    .controls,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.controls{margin-bottom:14px}.toolbar{margin-bottom:15px}
    label{display:block;color:#c8d8e6;font-size:.86rem;font-weight:600;margin-bottom:7px}
    input,select,textarea{width:100%;padding:9px 10px;min-height:40px;border:1px solid #35516a;border-radius:8px;color:#eaf3f9;background:#0a1b2b;outline:none}
    input:focus,select:focus,textarea:focus{border-color:#4cc7e8}textarea{resize:vertical;min-height:130px;line-height:1.45}
    input[type=checkbox]{width:17px;height:17px;min-height:auto;accent-color:#31b6d6;margin:0}
    .check{display:flex;align-items:center;gap:9px;font-weight:500;font-size:.9rem;margin:0}
    .field{min-width:0}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .toolbar input{max-width:320px}.toolbar select{max-width:180px}
    .table-wrap{overflow-x:auto;border:1px solid #284058;border-radius:11px}
    table{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #253b50;vertical-align:middle}th{font-size:.78rem;letter-spacing:.02em;color:#96adbf;font-weight:700;background:#132b3d;white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:#13283a}
    .name{font-weight:650;color:#ecf6fb}.sku{color:#97b1c7;font-size:.77rem;display:block;margin-top:3px;word-break:break-all}.nowrap{white-space:nowrap}
    .empty{padding:27px 16px;text-align:center;color:#9cb2c7;line-height:1.6}.empty strong{display:block;color:#dceaf5;margin-bottom:4px}
    .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #253b50}.row:last-child{border:0}
    .stack{display:grid;gap:12px}.right{text-align:right}.spread{display:flex;justify-content:space-between;gap:12px;align-items:center}
    .feed{display:grid;max-height:470px;overflow:auto}.feed-line{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid #253b50;font-size:.84rem;line-height:1.45}.feed-line:last-child{border:0}
    .feed-time{flex:0 0 128px;color:#87a1b5;font-variant-numeric:tabular-nums}.feed-msg{overflow-wrap:anywhere}
    .pill{font-size:.7rem;border-radius:5px;padding:2px 5px;margin-right:6px;background:#1d3a50;color:#8cddf2}.pill.ERROR{background:#5c303a;color:#ffbdc4}.pill.WARN{background:#5b452f;color:#ffdc9b}
    .pagination{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:.84rem;color:#abc3d4}
    .hint{font-size:.81rem;color:#93a9bc;line-height:1.55;margin:9px 0 0}.hint strong{color:#d7eaf4}
    .modal-shell{position:fixed;inset:0;z-index:10;background:#03101ecc;display:grid;place-items:center;padding:15px}
    .modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#10263a;border:1px solid #41617b;border-radius:15px;padding:20px}
    .modal-top{display:flex;justify-content:space-between;align-items:start;gap:15px;margin-bottom:12px}
    .code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.91rem;letter-spacing:.07em;color:#8ee6ea}
    #toast{position:fixed;bottom:20px;right:20px;max-width:min(440px,calc(100vw - 32px));padding:12px 15px;background:#1b4052;border:1px solid #56b9cc;border-radius:10px;z-index:20;box-shadow:0 15px 45px #0008;font-size:.88rem}
    #toast[hidden],#modal[hidden]{display:none}
    @media(max-width:900px){.shell{grid-template-columns:1fr}aside{height:auto;z-index:3;position:sticky;top:0;padding:8px 12px 0;border-right:0;border-bottom:1px solid #294157}.brand{margin:1px 0 7px;font-size:.91rem}.brand-mark{width:27px;height:27px}nav{display:flex;overflow-x:auto;gap:3px;scrollbar-width:none;margin:0 -2px}nav::-webkit-scrollbar{display:none}nav button{white-space:nowrap;padding:8px 11px;font-size:.82rem;min-height:38px}nav button.active{box-shadow:inset 0 -2px #4cc7e8}.aside-foot{display:none}main{padding:19px 14px 60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:560px){header{display:block;margin-bottom:16px}h1{font-size:1.35rem}.top-actions{justify-content:flex-start;margin-top:13px}.grid,.grid.two{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:13px}.metric{font-size:1.2rem}.fields,.fields.two{grid-template-columns:1fr}.feed-time{flex-basis:85px;font-size:.74rem}.toolbar input,.toolbar select{max-width:none}.toolbar>*{flex:1 1 145px}.section{margin-top:12px}.table-wrap{margin:0 -2px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><span class="brand-mark">D</span><span>Digi Tools</span></div>
      <nav aria-label="Menu utama" id="nav">
        <button data-view="overview" class="active">Ringkasan</button>
        <button data-view="products">Produk</button>
        <button data-view="sellers">Penjual</button>
        <button data-view="rules">Aturan</button>
        <button data-view="zones">Grup produk</button>
        <button data-view="history">Perubahan</button>
        <button data-view="logs">Log sistem</button>
        <button data-view="tools">Alat input</button>
        <button data-view="settings">Pengaturan</button>
        <button data-view="connection">Koneksi</button>
      </nav>
      <div class="aside-foot"><span class="dot" id="sidebar-dot"></span><span id="sidebar-status">Memuat status…</span><br>Penggunaan pribadi · dilindungi Access</div>
    </aside>
    <main>
      <header>
        <div><h1 id="title">Ringkasan</h1><p class="sub" id="subtitle">Pantau katalog dan seller Digiflazz.</p></div>
        <div class="top-actions"><button class="button" id="refresh">↻ Muat ulang</button><button class="button primary" id="scan">Pindai sekarang</button></div>
      </header>
      <div id="alert" role="status"></div>
      <div id="content" aria-live="polite"></div>
    </main>
  </div>
  <div id="modal" hidden></div><div id="toast" role="status" hidden></div>
  <script>
  (() => {
    const $=id=>document.getElementById(id);
    const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const rupiah=n=>"Rp"+Number(n||0).toLocaleString("id-ID");
    const fmt=s=>s?new Date(String(s).replace(" ","T")+"Z").toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"}):"—";
    const state={view:"overview",bootstrap:null,page:1,q:"",status:"all",category:"",brand:"",selected:null,toastTimer:null};
    const names={overview:["Ringkasan","Pantau katalog dan seller Digiflazz."],products:["Produk","Daftar SKU buyer dan status seller."],sellers:["Penjual","Pilih seller favorit, prioritas, atau blokir."],rules:["Aturan","Kriteria pemilihan seller untuk kategori, brand, dan produk."],zones:["Grup produk","Pisahkan supplier dengan aturan zona."],history:["Perubahan","Riwayat scan, harga, dan perpindahan seller."],logs:["Log sistem","Aktivitas terbaru dari pemindaian dan koneksi."],tools:["Alat input","Harga maksimum dan kode dari inisial game."],settings:["Pengaturan","Atur pemindaian, penilaian, dan penyimpanan."],connection:["Koneksi","Periksa sesi Digiflazz yang sudah tersimpan."]};
    async function api(path,options={}) {
      const res=await fetch(path,{...options,headers:{"content-type":"application/json",...(options.headers||{})}});
      const data=await res.json().catch(()=>({}));
      if(!res.ok)throw Error(data.error||"Permintaan gagal (HTTP "+res.status+")");
      return data;
    }
    function toast(text,bad=false) {
      clearTimeout(state.toastTimer);
      $("toast").textContent=text;$("toast").style.borderColor=bad?"#d8747d":"#56b9cc";$("toast").hidden=false;
      state.toastTimer=setTimeout(()=>$("toast").hidden=true,4500);
    }
    function message(text,type="warn"){$("alert").innerHTML=text?'<div class="banner '+type+'">'+esc(text)+'</div>':""}
    function loading(){$("content").innerHTML='<div class="card empty">Memuat data…</div>'}
    function badge(text,type="") {return '<span class="badge '+type+'">'+esc(text)+'</span>'}
    function error(e){message(e.message,"error");toast(e.message,true)}
    function button(label,action,extra=""){return '<button class="button '+extra+'" data-action="'+esc(action)+'">'+label+'</button>'}
    async function bootstrap() {
      const d=await api("/api/bootstrap");state.bootstrap=d;
      $("sidebar-dot").className="dot "+(d.connection.connected?"good":"warn");
      $("sidebar-status").textContent=d.connection.connected?"Digiflazz terhubung":"Digiflazz belum terhubung";
      if(!d.connection.connected)message("Sesi Digiflazz belum tersimpan. Buka Koneksi untuk menghubungkannya.");
      else if(d.lastScan?.status==="error")message("Scan terakhir gagal: "+d.lastScan.message);
      else if(d.counts.issues)message(d.counts.issues+" produk perlu perhatian. Periksa daftar Produk.","warn");
      else message("");
      return d;
    }
    function feed(rows) {return rows?.length?'<div class="feed">'+rows.map(x=>'<div class="feed-line"><span class="feed-time">'+fmt(x.created_at)+'</span><span class="feed-msg"><b class="pill '+esc(x.level)+'">'+esc(x.level)+'</b>'+esc(x.sku?x.sku+" · ":"")+esc(x.message)+'</span></div>').join("")+'</div>':'<div class="empty">Belum ada aktivitas.</div>'}
    async function overview() {
      const d=await bootstrap(),scan=d.lastScan,issues=d.counts.issues;
      $("content").innerHTML=
        '<div class="grid">'+
          metric("Koneksi",d.connection.connected?"Aktif":"Belum aktif",d.connection.lastTestStatus?"HTTP "+d.connection.lastTestStatus:"Sesi terenkripsi di D1")+
          metric("Produk",d.counts.products,"SKU hasil scan")+
          metric("Perlu perhatian",issues,issues?"Cek seller, stok, dan batas harga":"Tidak ada yang terdeteksi")+
          metric("Seller",d.counts.sellers,"Terdata di katalog")+
        '</div>'+
        '<section class="section grid two">'+
          '<div class="card"><div class="section-head"><h2>Monitor</h2>'+badge(d.settings.scanEnabled?"Aktif":"Berhenti",d.settings.scanEnabled?"good":"")+'</div>'+
            '<p class="sub">Pemindaian berjalan lewat Cloudflare Cron saat diaktifkan. Interval '+esc(d.settings.scanIntervalMinutes)+' menit.</p>'+
            '<div class="controls" style="margin-top:16px">'+button(d.settings.scanEnabled?"Hentikan monitor":"Mulai monitor","monitor","primary")+button("Pindai sekali","scan-now")+'</div>'+
            '<p class="hint">Scan terakhir: '+(scan?fmt(scan.finished_at)+" · "+esc(scan.status)+" · "+esc(scan.total)+" produk":"belum pernah")+'</p>'+
          '</div>'+
          '<div class="card"><div class="section-head"><h2>Auto Switch</h2>'+badge(d.settings.autoSwitch&&!d.settings.dryRun?"AKTIF":d.liveSwitchAvailable?"SIAP DIAKTIFKAN":"BELUM DIVERIFIKASI",d.settings.autoSwitch&&!d.settings.dryRun?"good":"warn")+'</div>'+
            '<p class="sub">'+(d.liveSwitchAvailable?"Switch manual sudah terverifikasi. Auto Switch dapat dinyalakan langsung.":"Lakukan 1x switch manual untuk memastikan Digiflazz menerima perubahan seller. Setelah berhasil, Auto Switch bisa dinyalakan.")+'</p>'+
            '<div class="controls" style="margin-top:16px">'+
              button("1. Tes Switch Manual","manual-test",d.liveSwitchAvailable?"":"primary")+
              button(d.settings.autoSwitch&&!d.settings.dryRun?"Matikan Auto Switch":"2. Aktifkan Auto Switch","toggle-auto",d.liveSwitchAvailable?"primary":"")+
              button("3. Jalankan Auto Switch Sekarang","run-auto",d.settings.autoSwitch&&!d.settings.dryRun?"primary":"")+
            '</div>'+
            '<p class="hint"><strong>Prioritas Auto Switch: Rating 4–5 → SLA tercepat → harga termurah.</strong> Jenis koneksi tidak ikut menentukan. Mode Uji = sistem hanya memantau dan memilih kandidat, tetapi tidak mengubah seller di Digiflazz.</p>'+
          '</div>'+
        '</section>'+
        '<section class="section card"><div class="section-head"><h2>Aktivitas terbaru</h2>'+button("Semua log","goto-logs","tiny")+'</div>'+feed(d.events)+'</section>';
    }
    function metric(label,value,detail){return '<div class="card"><div class="metric-label">'+esc(label)+'</div><div class="metric">'+esc(value)+'</div><div class="sub">'+esc(detail)+'</div></div>'}
    function problem(p){return !p.seller_name||!p.seller_active||(p.max_price>0&&p.price>p.max_price)||(p.stock===0&&!p.unlimited_stock)}
    async function products() {
      const params=new URLSearchParams({page:state.page,q:state.q,status:state.status,category:state.category,brand:state.brand});
      const d=await api("/api/products?"+params);
      $("content").innerHTML='<div class="card">'+
        '<div class="toolbar"><input id="search-product" aria-label="Cari produk" placeholder="Cari nama, SKU, brand, kategori" value="'+esc(state.q)+'">'+
        '<select id="filter-category" aria-label="Kategori"><option value="">Semua kategori</option>'+d.categories.map(x=>'<option value="'+esc(x)+'" '+(state.category===x?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select>'+
        '<select id="filter-brand" aria-label="Brand"><option value="">Semua brand</option>'+d.brands.map(x=>'<option value="'+esc(x)+'" '+(state.brand===x?"selected":"")+'>'+esc(x)+'</option>').join("")+'</select>'+
        '<select id="filter-product" aria-label="Status produk"><option value="all">Semua status</option><option value="issues" '+(state.status==="issues"?"selected":"")+'>Perlu perhatian</option><option value="locked" '+(state.status==="locked"?"selected":"")+'>Terkunci</option></select>'+button("Terapkan","search","primary")+'</div>'+
        '<p class="hint" style="margin:-4px 0 12px"><strong>Urutan:</strong> harga termurah → termahal.</p>'+
        '<div class="table-wrap"><table><thead><tr><th>Produk</th><th>Kategori</th><th>Brand</th><th>Seller</th><th>Harga</th><th>Max</th><th>Status</th><th>Aksi Digiflazz</th></tr></thead><tbody>'+
        (d.products.length?d.products.map(p=>'<tr><td><span class="name">'+esc(p.name)+'</span><span class="sku">'+esc(p.sku)+'</span></td><td>'+esc(p.category||"—")+'</td><td>'+esc(p.brand||"—")+'</td><td>'+esc(p.seller_name||"—")+'</td><td class="nowrap"><strong>'+rupiah(p.price)+'</strong></td><td class="nowrap">'+(p.max_price?rupiah(p.max_price):"—")+'</td><td>'+badge(p.locked?"Terkunci":problem(p)?"Perlu perhatian":p.active?"Aktif":"Nonaktif",p.locked?"":problem(p)?"bad":p.active?"good":"warn")+'</td><td><div class="controls"><button class="button tiny" data-action="product" data-sku="'+esc(p.sku)+'">Kelola</button><button class="button tiny '+(p.active?"warn":"primary")+'" data-action="toggle-product" data-sku="'+esc(p.sku)+'" data-active="'+(p.active?1:0)+'">'+(p.active?"OFF":"ON")+'</button><button class="button tiny danger" data-action="delete-product" data-sku="'+esc(p.sku)+'" data-name="'+esc(p.name)+'">Hapus</button></div></td></tr>').join(""):'<tr><td colspan="8" class="empty">Tidak ada produk sesuai filter.</td></tr>')+
        '</tbody></table></div>'+
        '<div class="pagination"><span>'+esc(d.total)+' produk · halaman '+esc(d.page)+'</span><button class="button tiny" data-action="prev" '+(state.page<=1?"disabled":"")+'>Sebelumnya</button><button class="button tiny" data-action="next" '+(d.page*50>=d.total?"disabled":"")+'>Berikutnya</button></div>'+
      '</div>';
    }
    async function product(sku) {
      const d=await api("/api/products/"+encodeURIComponent(sku)+"/options"),p=d.product;
      state.selected=p;
      $("modal").hidden=false;
      $("modal").innerHTML='<div class="modal-shell"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-top"><div><h2 id="modal-title">'+esc(p.name)+'</h2><span class="sku">'+esc(p.sku)+'</span></div><button class="button tiny" data-action="close">Tutup</button></div>'+
        '<div class="grid two"><div class="card"><div class="metric-label">Seller sekarang</div><div class="name">'+esc(p.seller_name||"—")+'</div><div class="hint">'+rupiah(p.price)+'</div></div><div class="card"><div class="metric-label">Harga maksimum</div><div class="name">'+(p.max_price?rupiah(p.max_price):"—")+'</div><div class="hint">Status '+(problem(p)?"perlu perhatian":"terpantau")+'</div></div></div>'+
        '<div class="controls" style="margin-top:14px"><button class="button tiny" data-action="lock" data-sku="'+esc(p.sku)+'">'+(p.locked?"Buka kunci otomasi":"Kunci dari otomasi")+'</button><button class="button tiny" data-action="copy-price">Salin harga max</button><button class="button tiny '+(p.active?"warn":"primary")+'" data-action="toggle-product" data-sku="'+esc(p.sku)+'" data-active="'+(p.active?1:0)+'">'+(p.active?"OFF Produk":"ON Produk")+'</button><button class="button tiny danger" data-action="delete-product" data-sku="'+esc(p.sku)+'" data-name="'+esc(p.name)+'">Hapus dari Digiflazz</button></div>'+
        '<div class="controls" style="margin-top:12px"><label for="product-sku" style="margin:0">SKU Buyer</label><input id="product-sku" type="text" maxlength="50" autocomplete="off" style="max-width:180px" value="'+esc(p.sku)+'"><button class="button tiny primary" data-action="save-sku">Simpan SKU</button></div>'+
        '<p class="hint">Edit SKU, ON/OFF, dan Hapus di halaman ini menulis langsung ke produk Buyer Digiflazz lalu diverifikasi ulang.</p>'+
        '<div class="controls" style="margin-top:12px"><label for="product-max" style="margin:0">Set harga max</label><input id="product-max" type="number" min="1" inputmode="numeric" style="max-width:180px" value="'+esc(p.max_price||"")+'"><button class="button tiny" data-action="save-max">Simpan ke Digiflazz</button></div>'+
        (d.operation&&["pending","unknown"].includes(d.operation.status)?'<div class="banner" style="margin-top:12px">Ada perubahan yang hasilnya belum pasti. <button class="button tiny" data-action="reconcile">Periksa ulang di Digiflazz</button></div>':"")+

    async function write(path,body,method="POST") {return api(path,{method,body:method==="DELETE"?"{}":JSON.stringify(body||{})})}
    async function action(a,el) {
      if(a==="scan-now"){toast("Memindai katalog…");const d=await write("/api/scan");toast(d.total+" produk dipindai; "+d.issues+" perlu perhatian.");return render()}
      if(a==="manual-test"){
        const d=await api("/api/products?"+new URLSearchParams({page:"1",q:"",status:"issues"}));
        const first=d.products?.[0];
        if(!first)throw Error("Tidak ada produk bermasalah untuk dites.");
        toast("Membuka kandidat seller untuk "+first.sku+"…");
        return product(first.sku);
      }
      if(a==="toggle-auto"){
        const d=state.bootstrap||await bootstrap();
        const active=d.settings.autoSwitch&&!d.settings.dryRun;
        if(!active&&!d.liveSwitchAvailable){
          toast("Lakukan Tes Switch Manual dulu. Saya buka produknya sekarang.");
          return action("manual-test",el);
        }
        await write("/api/settings",{autoSwitch:!active,dryRun:active,scanEnabled:true});
        toast(active?"Auto Switch dimatikan. Mode Uji aktif.":"Auto Switch AKTIF. Mode Uji dimatikan.");
        return render();
      }
      if(a==="run-auto"){
        const d=state.bootstrap||await bootstrap();
        if(!(d.settings.autoSwitch&&!d.settings.dryRun)){
          if(!d.liveSwitchAvailable){toast("Verifikasi 1x switch manual dulu.");return action("manual-test",el)}
          await write("/api/settings",{autoSwitch:true,dryRun:false,scanEnabled:true});
        }
        toast("Memilih seller termurah yang lolos untuk batch produk bermasalah…");
        const result=await write("/api/automation/run",{});
        toast("Auto Switch: "+result.switched+" berhasil, "+result.noCandidate+" tanpa kandidat, "+result.failed+" gagal.");
        return render();
      }
      if(a==="monitor"){const d=state.bootstrap;await write("/api/settings",{scanEnabled:!d.settings.scanEnabled});return render()}
      if(a.startsWith("goto-"))return render({ "goto-rules":"rules","goto-history":"history","goto-logs":"logs" }[a]);
      if(a==="search"){state.q=$("search-product").value;state.status=$("filter-product").value;state.category=$("filter-category").value;state.brand=$("filter-brand").value;state.page=1;return render()}
      if(a==="prev"||a==="next"){state.page+=a==="next"?1:-1;return render()}
      if(a==="product")return product(el.dataset.sku);
      if(a==="switch-seller"){
        const p=state.selected;
        if(!confirm("Pindah seller SKU "+p.sku+" ke "+el.dataset.sellerName+" ("+rupiah(el.dataset.sellerPrice)+") di Digiflazz?"))return;
        toast("Menyimpan dan mengecek seller di Digiflazz…");
        const result=await write("/api/products/"+encodeURIComponent(p.sku)+"/switch",{sellerId:el.dataset.sellerId});
        toast("Seller "+result.seller+" tersimpan dan terkonfirmasi.");
        $("modal").hidden=true;return render();
      }
      if(a==="save-sku"){
        const p=state.selected,newSku=$("product-sku").value.trim();
        if(!/^[A-Za-z0-9._-]{1,50}$/.test(newSku))throw Error("SKU hanya boleh huruf, angka, titik, garis bawah, atau minus.");
        if(newSku===p.sku)return toast("SKU tidak berubah.");
        if(!confirm("Ubah SKU Buyer "+p.sku+" menjadi "+newSku+" langsung di Digiflazz?"))return;
        toast("Mengubah SKU di Digiflazz…");
        const result=await write("/api/products/"+encodeURIComponent(p.sku)+"/sku",{sku:newSku});
        toast("SKU berhasil diubah dan terkonfirmasi: "+result.sku);
        $("modal").hidden=true;state.selected=null;return render("products");
      }
      if(a==="toggle-product"){
        const sku=el.dataset.sku||state.selected?.sku;
        if(!sku)throw Error("SKU produk tidak ditemukan.");
        const currentlyActive=el.dataset.active==="1";
        const next=!currentlyActive;
        if(!confirm((next?"Aktifkan":"Nonaktifkan")+" SKU "+sku+" langsung di Digiflazz?"))return;
        toast((next?"Mengaktifkan":"Menonaktifkan")+" produk di Digiflazz…");
        await write("/api/products/"+encodeURIComponent(sku)+"/status",{active:next});
        toast("Produk "+sku+" sekarang "+(next?"ON":"OFF")+" di Digiflazz.");
        if(state.selected?.sku===sku){$("modal").hidden=true;state.selected=null}
        return render("products");
      }
      if(a==="delete-product"){
        const sku=el.dataset.sku||state.selected?.sku,name=el.dataset.name||state.selected?.name||sku;
        if(!sku)throw Error("SKU produk tidak ditemukan.");
        if(!confirm('HAPUS "'+name+'" ('+sku+') dari Digiflazz?\n\nDigiflazz memperingatkan: setelah produk dihapus, cek status transaksi lama menggunakan kode produk ini tidak dapat dilakukan lagi.'))return;
        if(!confirm("Konfirmasi terakhir: benar-benar hapus "+sku+" dari daftar produk Buyer Digiflazz?"))return;
        toast("Menghapus produk dari Digiflazz…");
        await write("/api/products/"+encodeURIComponent(sku),{},"DELETE");
        toast("Produk "+sku+" sudah dihapus dan terkonfirmasi di Digiflazz.");
        $("modal").hidden=true;state.selected=null;return render("products");
      }
      if(a==="save-max"){
        const p=state.selected,amount=Number($("product-max").value);
        if(!Number.isSafeInteger(amount)||amount<1)throw Error("Masukkan harga maksimum yang benar.");
        if(!confirm("Simpan harga maksimum "+rupiah(amount)+" untuk SKU "+p.sku+" di Digiflazz?"))return;
        toast("Menyimpan harga maksimum…");
        await write("/api/products/"+encodeURIComponent(p.sku)+"/max-price",{maxPrice:amount});
        toast("Harga maksimum dikonfirmasi di Digiflazz.");$("modal").hidden=true;return render();
      }
      if(a==="reconcile"){
        const p=state.selected;
        const result=await write("/api/products/"+encodeURIComponent(p.sku)+"/reconcile");
        toast(result.confirmed?"Perubahan terkonfirmasi di Digiflazz.":"Target tidak ditemukan. Periksa produk sebelum mencoba lagi.",!result.confirmed);
        return product(p.sku);
      }
      if(a==="close"){$("modal").hidden=true;return}
      if(a==="lock"){const p=state.selected;await write("/api/products/"+encodeURIComponent(p.sku)+"/lock",{locked:!p.locked});toast("Kunci produk diperbarui.");$("modal").hidden=true;return render()}
      if(a==="copy-price"){await navigator.clipboard.writeText(String(state.selected.max_price||state.selected.price));return toast("Harga disalin.")}
      if(a==="delete-rule"){if(!confirm("Hapus aturan ini?"))return;await write("/api/rules/"+el.dataset.id,{},"DELETE");return render()}
      if(a==="delete-zone"){if(!confirm("Hapus zona dan seluruh penugasannya?"))return;await write("/api/zones/"+el.dataset.id,{},"DELETE");return render()}
      if(a==="refresh-logs")return render();
      if(a==="test-connection"){const d=await write("/api/connection/test");toast("Uji sesi: HTTP "+d.httpStatus+(d.connected?" · tersambung":" · gagal"),!d.connected);return render()}
      if(a==="discover"){toast("Membaca jalur dashboard Digiflazz…");const d=await write("/api/discover");toast(d.count+" jalur API ditemukan untuk pemeriksaan.");return}
      if(a==="generate"){
        const d=await write("/api/service-code",{game:$("code-game").value,product:$("code-product").value});
        $("code-result").textContent=d.code;$("code-result").dataset.available=String(d.available);
        return toast(d.available?"Kode "+d.code+" siap disalin.":"Kode "+d.code+" sudah dipakai pada katalog; periksa SKU dahulu.",!d.available);
      }
      if(a==="copy-code"){const node=$("code-result"),c=node.textContent;if(!/^[A-Z]{1,5}[0-9]+$/.test(c)||node.dataset.available!=="true")throw Error("Kode belum siap atau sudah dipakai.");await navigator.clipboard.writeText(c);return toast("Kode disalin.")}
      if(a==="save-offset"){
        const value=Number($("addon").value);
        if(!Number.isSafeInteger(value)||value<0||value>1000000000)throw Error("Tambahan max price harus angka rupiah positif.");
        await write("/api/settings",{maxPriceOffset:value});toast("Tambahan global Rp"+value.toLocaleString("id-ID")+" tersimpan.");
        return;
      }
      if(a==="copy-result"){const v=$("price-result").dataset.value;if(!v)throw Error("Isi harga modal dulu.");await navigator.clipboard.writeText(v);return toast("Harga disalin.")}
    }
    $("nav").addEventListener("click",e=>{const b=e.target.closest("button[data-view]");if(b)render(b.dataset.view)});
    $("refresh").addEventListener("click",()=>render());
    $("scan").addEventListener("click",async()=>{try{await action("scan-now")}catch(e){error(e)}});
    document.addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;try{b.disabled=true;await action(b.dataset.action,b)}catch(err){error(err)}finally{if(b.isConnected)b.disabled=false}});
    document.addEventListener("change",async e=>{
      if(e.target.matches(".seller-mode")){try{await write("/api/sellers/"+encodeURIComponent(e.target.dataset.name)+"/preference",{mode:e.target.value});toast("Pilihan seller tersimpan.")}catch(err){error(err)}}
      if(e.target.id==="filter-category"){state.category=e.target.value;state.brand="";state.page=1;return render("products")}
    });
    document.addEventListener("input",e=>{if(e.target.id==="cost"||e.target.id==="addon"){const cost=Number($("cost").value),addition=Number($("addon").value),out=$("price-result");const value=cost+addition;out.textContent=cost>0&&addition>=0?rupiah(value):"—";out.dataset.value=cost>0&&addition>=0?String(value):""}});
    document.addEventListener("submit",async e=>{
      if(!["rule-form","zone-form","assign-form","settings-form","connection-form"].includes(e.target.id))return;
      e.preventDefault();const f=e.target,b=new FormData(f),id=f.id;
      try{
        if(id==="rule-form")await write("/api/rules",{scope_type:b.get("scope_type"),scope_value:b.get("scope_value"),min_rating:b.get("min_rating")===""?null:Number(b.get("min_rating")),max_price:b.get("max_price")===""?null:Number(b.get("max_price")),require_stock:b.has("require_stock"),avoid_cutoff:b.has("avoid_cutoff")});
        if(id==="zone-form")await write("/api/zones",Object.fromEntries(b));
        if(id==="assign-form")await write("/api/zones/assign",Object.fromEntries(b));
        if(id==="connection-form"){await write("/api/connection",{curl:b.get("curl")});$("curl").value=""}
        if(id==="settings-form"){await write("/api/settings",{scanEnabled:b.has("scanEnabled"),autoSwitch:b.has("autoSwitch"),dryRun:b.has("dryRun"),autoFillMaxPrice:b.has("autoFillMaxPrice"),proactiveScan:b.has("proactiveScan"),scanIntervalMinutes:Number(b.get("scanIntervalMinutes")),minRating:Number(b.get("minRating")),minReviews:Number(b.get("minReviews")),priceCap:Number(b.get("priceCap")),maxPriceOffset:Number(b.get("maxPriceOffset")),minSavingsPercent:Number(b.get("minSavingsPercent")),reoptimizeHours:Number(b.get("reoptimizeHours")),saveMode:b.get("saveMode")})}
        toast("Tersimpan.");if(id!=="settings-form"||b.get("saveMode")!=="auto")await render();
      }catch(err){error(err)}
    });
    render();
  })();
  </script>
</body>
</html>
